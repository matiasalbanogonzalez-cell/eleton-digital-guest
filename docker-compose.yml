services:
  postgres:
    image: postgres:16
    container_name: eleton-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recreacion_eleton
    ports:
      - "5432:5432"
    volumes:
      - eleton_postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: eleton-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/recreacion_eleton?schema=public
      JWT_SECRET: cambia-esto-por-un-secreto-largo-y-aleatorio
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      - postgres

volumes:
  eleton_postgres_data: